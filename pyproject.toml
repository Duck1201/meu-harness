[project]
name = "harness-2"
version = "1.0.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.12.15",
    "fastapi==0.116.1",
    "httpx>=0.28.1",
    "jsonschema>=4.25.0",
    "markdownify>=1.1",
    "pydantic>=2.11.7",
    "pypdf>=6.15.0",
    "python-multipart>=0.0.32",
    "scrapling>=0.4.15,<0.5",
    "sqlite-vec>=0.1.9",
    "tokenizers==0.21.4",
    "uvicorn==0.35.0",
]

[project.scripts]
harness = "harness.__main__:main"

[project.optional-dependencies]
browser = [
    "scrapling[fetchers]>=0.4.15,<0.5",
]
# Juiz de Corpus (ADR 0015). O torch vem do índice CPU do PyTorch: o juiz roda na
# CPU para não disputar a VRAM com o modelo de chat, e o wheel padrão traz CUDA.
judge = [
    "laya==0.3.6",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "ruff>=0.12.8",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "judge" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
